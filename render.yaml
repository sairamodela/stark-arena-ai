services:
  - type: web
    name: stark-arena
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: TELEGRAM_MODE
        value: webhook
      - key: TONY_TOKEN
        sync: false
      - key: FRIDAY_TOKEN
        sync: false
      - key: JARVIS_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_BASE
        sync: false
